<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What to Wear</title>
    <script type="module" crossorigin src="/what-to-wear/assets/index-C5rupvzN.js"></script>
    <link rel="stylesheet" crossorigin href="/what-to-wear/assets/index-CgS81MT7.css">
  </head>
  <body>
    <div id="sky" class="sky" aria-hidden="true"></div>

    <main id="home">
      <h1>What to Wear</h1>

      <div class="day-switch" role="group" aria-label="Which day to dress for">
        <button type="button" data-day="today" aria-pressed="true">Today</button>
        <button type="button" data-day="tomorrow" aria-pressed="false">Tomorrow</button>
      </div>

      <div id="warnings" class="warning-banner" role="alert" hidden></div>

      <section class="card" aria-labelledby="weather-heading">
        <h2 id="weather-heading">Today's weather</h2>
        <div id="weather" aria-live="polite"></div>
      </section>

      <section class="card" aria-labelledby="outfit-heading">
        <div class="section-header">
          <h2 id="outfit-heading">Today's outfit</h2>
          <div class="header-actions">
            <button id="reshuffle" type="button" class="secondary" hidden>Show another</button>
            <button id="try-on" type="button" hidden>Try it on</button>
          </div>
        </div>
        <div id="outfit" aria-live="polite"></div>
      </section>

      <section class="card closet-entry" aria-labelledby="closet-heading">
        <button id="open-closet" type="button" class="wardrobe-button" aria-describedby="closet-summary">
          <span id="wardrobe-art"></span>
          <span class="wardrobe-text">
            <span id="closet-heading" class="wardrobe-title">My closet</span>
            <span id="closet-summary" class="status"></span>
            <span class="wardrobe-hint">Tap to open ›</span>
          </span>
        </button>
      </section>
    </main>

    <main id="closet-screen" hidden>
      <div class="screen-header">
        <button id="close-closet" type="button" class="secondary back-button">‹ Back</button>
        <h1>My closet</h1>
      </div>

      <section class="card add-panel">
        <button id="toggle-add" type="button" aria-expanded="false" aria-controls="add-form">+ Add clothes</button>
        <form id="add-form" hidden>
          <label class="photo-picker">
            <span>Photo</span>
            <input id="photo" name="photo" type="file" accept="image/*" required />
          </label>
          <label>
            <span>What is it?</span>
            <select id="category" name="category" required></select>
          </label>
          <label>
            <span>How warm?</span>
            <select id="warmth" name="warmth" required></select>
          </label>
          <label>
            <span>Name (optional)</span>
            <input id="name" name="name" type="text" maxlength="40" placeholder="e.g. grey hoodie" />
          </label>
          <button type="submit">Add to closet</button>
        </form>
        <p id="form-status" class="status" aria-live="polite"></p>
      </section>

      <div id="closet" class="wardrobe-interior"></div>
    </main>

    <main id="fitting-screen" hidden>
      <div class="screen-header">
        <button id="close-fitting" type="button" class="secondary back-button">‹ Back</button>
        <h1>Fitting room</h1>
      </div>

      <div class="fitting-layout">
        <div class="card mirror">
          <p id="fitting-day" class="status"></p>
          <div id="mannequin" class="mannequin"></div>
          <p class="status">Drag to turn the mannequin around.</p>
        </div>

        <div class="fitting-side">
          <section class="card" aria-labelledby="look-heading">
            <h2 id="look-heading">What it's wearing</h2>
            <p class="status">Picked for the weather. Use the arrows to try something else.</p>
            <div id="look-controls"></div>
          </section>

          <details id="body-panel" class="card">
            <summary>My measurements</summary>
            <form id="body-form" novalidate>
              <fieldset>
                <legend>Mannequin</legend>
                <div id="figure-options" class="chips"></div>
              </fieldset>
              <div class="measurements">
                <label>Height <span class="with-unit"><input id="body-heightCm" type="number" inputmode="decimal" step="0.5" /> cm</span></label>
                <label>Weight <span class="with-unit"><input id="body-weightKg" type="number" inputmode="decimal" step="0.5" /> kg</span></label>
                <label>Bust <span class="with-unit"><input id="body-bustCm" type="number" inputmode="decimal" step="0.5" /> cm</span></label>
                <label>Waist <span class="with-unit"><input id="body-waistCm" type="number" inputmode="decimal" step="0.5" /> cm</span></label>
                <label>Hips <span class="with-unit"><input id="body-hipCm" type="number" inputmode="decimal" step="0.5" /> cm</span></label>
              </div>
              <ul id="body-errors" class="form-errors" aria-live="polite"></ul>
              <button type="submit">Save</button>
              <p id="body-status" class="status" aria-live="polite"></p>
              <p class="status">Your measurements are only saved on this device.</p>
            </form>
          </details>
        </div>
      </div>
    </main>

  </body>
</html>
