<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What to Wear</title>
    <script type="module" crossorigin src="/what-to-wear/assets/index-B3CApLRf.js"></script>
    <link rel="stylesheet" crossorigin href="/what-to-wear/assets/index-D203cSXi.css">
  </head>
  <body>
    <main>
      <h1>What to Wear</h1>

      <section class="card" aria-labelledby="weather-heading">
        <h2 id="weather-heading">Today in Champaign</h2>
        <div id="weather" aria-live="polite"></div>
      </section>

      <section class="card" aria-labelledby="outfit-heading">
        <div class="section-header">
          <h2 id="outfit-heading">Today's outfit</h2>
          <button id="reshuffle" type="button" class="secondary" hidden>Show another</button>
        </div>
        <div id="outfit" aria-live="polite"></div>
      </section>

      <section class="card" aria-labelledby="closet-heading">
        <h2 id="closet-heading">My closet</h2>
        <form id="add-form">
          <label class="photo-picker">
            <span>Photo</span>
            <input id="photo" name="photo" type="file" accept="image/*" required />
          </label>
          <label>
            <span>What is it?</span>
            <select id="category" name="category" required></select>
          </label>
          <label>
            <span>How warm?</span>
            <select id="warmth" name="warmth" required></select>
          </label>
          <label>
            <span>Name (optional)</span>
            <input id="name" name="name" type="text" maxlength="40" placeholder="e.g. grey hoodie" />
          </label>
          <button type="submit">Add to closet</button>
          <p id="form-status" class="status" aria-live="polite"></p>
        </form>
        <div id="closet"></div>
      </section>
    </main>
  </body>
</html>
